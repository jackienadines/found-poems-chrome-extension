<!doctype html>
<html>
    <head>
        <style>
            body {
                width: 250px;
                padding: 20px;
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
            }
            h2 {
                margin-top: 0;
                color: #333;
            }
            p {
                font-size: 13px;
                line-height: 1.5;
                color: #666;
            }
            button {
                border: none;
                padding: 10px 15px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                width: 100%;
                margin-top: 10px;
            }
            #toggleButton.off {
                background-color: #cccccc;
                color: #333;
            }
            #toggleButton.on {
                background-color: #007bff;
                color: white;
            }
        </style>
    </head>
    <body>
        <h2>Found Poems</h2>
        <p>Highlight any words on the page to redact them.</p>
        <button id="toggleButton" class="off">Turn On</button>
        <script src="popup.js"></script>
    </body>
</html>
